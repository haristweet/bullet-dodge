<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>弾避け練習</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas { display: block; cursor: none; touch-action: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = 360, H = 640;
C.width = W; C.height = H;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  C.style.width = W * s + 'px';
  C.style.height = H * s + 'px';
}
resize();
addEventListener('resize', resize);

// ══════════════════════════════════════════════
// INPUT
// ══════════════════════════════════════════════
const keys = new Set();
let mouseX = W/2, mouseY = H-90, mouseBtn = false, mouseMoved = false;
let touchActive = false, touchX = W/2, touchY = H-90;

function canvasXY(cx, cy) {
  const r = C.getBoundingClientRect();
  return [(cx - r.left) * W / r.width, (cy - r.top) * H / r.height];
}

addEventListener('keydown', e => { keys.add(e.code); onAction(); e.preventDefault(); });
addEventListener('keyup',   e => keys.delete(e.code));

C.addEventListener('mousemove', e => {
  [mouseX, mouseY] = canvasXY(e.clientX, e.clientY);
  mouseMoved = true;
  mouseBtn = (e.buttons & 1) !== 0;
});
C.addEventListener('mousedown', () => { mouseBtn = true; onAction(); });
C.addEventListener('mouseup',   () => mouseBtn = false);

C.addEventListener('touchstart', e => {
  e.preventDefault();
  [touchX, touchY] = canvasXY(e.touches[0].clientX, e.touches[0].clientY);
  touchActive = true;
  onAction();
}, { passive: false });
C.addEventListener('touchmove', e => {
  e.preventDefault();
  [touchX, touchY] = canvasXY(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
C.addEventListener('touchend', e => {
  if (!e.touches.length) touchActive = false;
}, { passive: false });

// ══════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════
const P_R       = 13;   // player visual radius
const P_HIT_R   = 4;    // actual hitbox radius
const P_GRAZE_R = 20;   // graze detection radius
const P_SPD     = 4.5;  // normal speed
const P_SLOW    = 1.8;  // slow speed
const INV_DUR   = 120;  // invincibility frames after hit
const MAX_LIVES = 3;
const WAVE_DUR  = 20 * 60; // frames per wave
const WAVE_INTRO_DUR = 148; // frames for wave-start dramatic intro

const WAVE_WORDS = [
  '覚悟せよ',
  '禍い来たれり',
  '滅',
  '死ぬがよい',
  '絶望',
  '奈落',
  '鏖殺',
  '終焉',
  '地獄',
  '虚無',
];

// ══════════════════════════════════════════════
// GAME STATE
// ══════════════════════════════════════════════
let gs = 'menu'; // menu | play | gameover
let frame = 0;   // total animation frames
let gf = 0;      // game frames (play only)

let px, py, pLives, pInv, pSlow;
let grazeCount, grazeFlash;
let bullets;
let score, survivedF, wave, waveTimerF;
let deathFlash, waveIntroTimer;
let roster;

// Boss (dynamic position)
const B_R = 26;
let bossX = W / 2, bossY = 68, bossMoveT = 0;

// ボス移動パターン (wave/2 のインデックスで切り替え)
const BOSS_MOVES = [
  // 0: ゆったり正弦波ドリフト (wave 1-2)
  t => {
    bossX = W/2 + Math.sin(t * 0.018) * 65;
    bossY = 70  + Math.sin(t * 0.011) * 12;
  },
  // 1: 横幅広めのスウィープ (wave 3-4)
  t => {
    bossX = W/2 + Math.sin(t * 0.030) * 105;
    bossY = 70  + Math.sin(t * 0.017) * 18;
  },
  // 2: 8の字 (wave 5-6)
  t => {
    bossX = W/2 + Math.sin(t * 0.040) * 115;
    bossY = 70  + Math.sin(t * 0.080) * 28;
  },
  // 3: 多周波の不規則移動 (wave 7-8)
  t => {
    bossX = W/2 + Math.sin(t * 0.055) * 115 + Math.sin(t * 0.120 + 2) * 35;
    bossY = 62  + Math.abs(Math.sin(t * 0.036)) * 48;
  },
  // 4: 最大カオス (wave 9-10)
  t => {
    bossX = W/2 + Math.sin(t * 0.072) * 125 + Math.sin(t * 0.190 + 1) * 42;
    bossY = 55  + Math.sin(t * 0.050) * 50   + Math.sin(t * 0.095) * 18;
  },
];

function updateBoss() {
  bossMoveT++;
  const idx = Math.min(Math.floor(wave / 2), BOSS_MOVES.length - 1);
  BOSS_MOVES[idx](bossMoveT);
  bossX = Math.max(B_R + 8, Math.min(W - B_R - 8, bossX));
  bossY = Math.max(38,       Math.min(130,          bossY));
}

// ══════════════════════════════════════════════
// BULLET PATTERNS
// ══════════════════════════════════════════════
function bul(x, y, vx, vy, r, col) {
  return { x, y, vx, vy, r: r||5, col: col||'#ff4466', alive: true, grazed: false };
}
function ring(x, y, n, spd, r, col, off) {
  off = off || 0;
  for (let i = 0; i < n; i++) {
    const a = off + i / n * Math.PI * 2;
    bullets.push(bul(x, y, Math.cos(a)*spd, Math.sin(a)*spd, r, col));
  }
}
function aimed(x, y, spd, spread, r, col) {
  const n = spread > 0 ? 3 : 1;
  const a0 = Math.atan2(py - y, px - x);
  for (let i = 0; i < n; i++) {
    const a = a0 + (i - Math.floor(n/2)) * (spread || 0);
    bullets.push(bul(x, y, Math.cos(a)*spd, Math.sin(a)*spd, r, col));
  }
}
function needle(x, y, vx, vy, len, col) {
  return { x, y, vx, vy, r: 2.5, col: col||'#ffffff', alive: true, grazed: false, shape: 'needle', len: len||18 };
}

const PAT = {
  ring: {
    t: 0,
    iv() { return Math.max(58 - wave*3, 28); },
    fn() {
      const n   = Math.min(14 + wave*2, 32);
      const spd = 1.8 + wave*0.12;
      ring(bossX, bossY, n, spd, 5, '#ff6699', gf*0.04);
    }
  },
  spiral: {
    t: 0,
    iv() { return Math.max(7 - Math.floor(wave*0.4), 4); },
    fn() {
      const arms = 3 + Math.floor(wave/3);
      const spd  = 2.2 + wave*0.12;
      for (let i = 0; i < arms; i++) {
        const a = gf*0.12 + i/arms*Math.PI*2;
        bullets.push(bul(bossX, bossY, Math.cos(a)*spd, Math.sin(a)*spd, 5, '#ffaa44'));
      }
    }
  },
  aimed: {
    t: 0,
    iv() { return Math.max(58 - wave*3, 25); },
    fn() {
      aimed(bossX, bossY, 3.0 + wave*0.20, wave >= 4 ? 0.22 : 0, 6, '#44aaff');
    }
  },
  scatter: {
    t: 0,
    iv() { return Math.max(40 - wave*2, 18); },
    fn() {
      const n   = 4 + Math.floor(wave*1.2);
      const spd = 2.0 + wave*0.12;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        bullets.push(bul(bossX, bossY, Math.cos(a)*spd, Math.sin(a)*spd, 4, '#cc44ff'));
      }
    }
  },
  sweep: {
    t: 0,
    iv() { return Math.max(9 - Math.floor(wave*0.4), 5); },
    fn() {
      const n   = 2 + Math.floor(wave/3);
      const spd = 2.5 + wave*0.15;
      for (let i = 0; i < n; i++) {
        const a = -Math.PI/2 + Math.sin(gf*0.06 + i*1.2) * 0.9;
        bullets.push(bul(bossX, bossY, Math.cos(a)*spd, Math.sin(a)*spd, 5, '#ffff44'));
      }
    }
  },
  cross: {
    t: 0,
    iv() { return Math.max(18 - wave, 9); },
    fn() {
      const spd = 2.8 + wave*0.15;
      for (let i = 0; i < 4; i++) {
        const a = i/4 * Math.PI*2 + gf*0.025;
        bullets.push(bul(bossX, bossY, Math.cos(a)*spd, Math.sin(a)*spd, 5, '#44ffaa'));
      }
    }
  },
  flower: {
    t: 0,
    iv() { return Math.max(13 - Math.floor(wave*0.3), 7); },
    fn() {
      const n   = 8;
      const spd = 2.2 + wave*0.12;
      const t   = gf * 0.05;
      for (let i = 0; i < n; i++) {
        const a = i/n * Math.PI*2 + t;
        const s = 0.5 + 0.5 * Math.abs(Math.sin(n/2 * a));
        bullets.push(bul(bossX, bossY, Math.cos(a)*spd*s, Math.sin(a)*spd*s, 5, '#ff88ff'));
      }
    }
  },
  burst: {
    t: 0,
    iv() { return Math.max(65 - wave*3, 28); },
    fn() {
      const n   = 7 + wave;
      const spd = 2.8 + wave*0.18;
      const a0  = Math.atan2(py - bossY, px - bossX);
      for (let i = 0; i < n; i++) {
        const a = a0 + (i - Math.floor(n/2)) * 0.18;
        bullets.push(bul(bossX, bossY, Math.cos(a)*spd, Math.sin(a)*spd, 5, '#00ffff'));
      }
    }
  },

  // ── 針弾パターン ──────────────────────────────
  needle_fan: {
    t: 0,
    iv() { return Math.max(80 - wave*3, 45); },
    fn() {
      const n      = Math.min(22 + wave*3, 52);
      const spd    = 2.5 + wave*0.15;
      const spread = Math.PI * 0.85;
      const a0     = Math.atan2(py - bossY, px - bossX);
      for (let i = 0; i < n; i++) {
        const a = a0 - spread/2 + i/(n-1) * spread;
        bullets.push(needle(bossX, bossY, Math.cos(a)*spd, Math.sin(a)*spd, 20, '#ffffff'));
      }
    }
  },

  needle_wall: {
    t: 0,
    iv() { return Math.max(90 - wave*4, 50); },
    fn() {
      const n   = 9 + Math.floor(wave*1.5);
      const spd = 3.0 + wave*0.18;
      for (let i = 0; i < n; i++) {
        const x  = (i + 0.5) / n * W;
        const vx = (Math.random() - 0.5) * 0.4;
        bullets.push(needle(x, bossY + 15, vx, spd, 22, '#88ffff'));
      }
    }
  },

  needle_rain: {
    t: 0,
    iv() { return Math.max(10 - Math.floor(wave*0.3), 5); },
    fn() {
      const x   = Math.random() * W;
      const spd = 3.0 + wave*0.15;
      const a   = -Math.PI/2 + (Math.random() - 0.5) * 0.7;
      bullets.push(needle(x, -5, Math.cos(a)*spd, Math.sin(a)*spd, 16, '#ffeeaa'));
    }
  },

  needle_ring: {
    t: 0,
    iv() { return Math.max(38 - wave*2, 18); },
    fn() {
      const n   = Math.min(12 + wave*2, 30);
      const spd = 2.2 + wave*0.15;
      const off = gf * 0.07;
      for (let i = 0; i < n; i++) {
        const a = off + i/n * Math.PI*2;
        bullets.push(needle(bossX, bossY, Math.cos(a)*spd, Math.sin(a)*spd, 20, '#aaffcc'));
      }
    }
  },
};

// Wave pattern rosters (indices match wave number 0–9)
const ROSTER = [
  ['ring'],                                                      // 1
  ['ring', 'aimed'],                                             // 2
  ['ring', 'spiral'],                                            // 3
  ['spiral', 'aimed', 'scatter'],                                // 4
  ['ring', 'needle_fan', 'aimed'],                               // 5 ← 針弾扇
  ['cross', 'spiral', 'needle_wall'],                            // 6 ← 針弾壁
  ['burst', 'needle_rain', 'ring'],                              // 7 ← 針弾雨
  ['flower', 'needle_ring', 'spiral'],                           // 8 ← 針弾リング
  ['flower', 'needle_fan', 'needle_rain', 'burst'],              // 9
  ['flower', 'cross', 'needle_fan', 'needle_ring', 'needle_rain'], // 10 最終
];

// ══════════════════════════════════════════════
// STARFIELD
// ══════════════════════════════════════════════
const STARS = Array.from({length: 90}, () => ({
  x: Math.random()*W, y: Math.random()*H,
  r: Math.random()*1.4+0.3, spd: Math.random()*0.8+0.2, a: Math.random()*0.7+0.3
}));

// ══════════════════════════════════════════════
// HI-SCORE
// ══════════════════════════════════════════════
let hiScores = [];
function loadHiScores() {
  try { hiScores = JSON.parse(localStorage.getItem('bhd_hi') || '[]'); }
  catch(e) { hiScores = []; }
}
function saveHiScore(entry) {
  loadHiScores();
  hiScores.push(entry);
  hiScores.sort((a, b) => b.score - a.score);
  hiScores = hiScores.slice(0, 5);
  localStorage.setItem('bhd_hi', JSON.stringify(hiScores));
}
loadHiScores();

// ══════════════════════════════════════════════
// MENU DEMO BULLETS (タイトル画面の背景装飾)
// ══════════════════════════════════════════════
let demoBullets = [];
let demoFireT = 0;

function updateMenuDemo() {
  demoFireT--;
  if (demoFireT <= 0) {
    demoFireT = 45;
    const dx = W/2 + Math.sin(frame * 0.013) * 100;
    const n = 18, spd = 1.1;
    for (let i = 0; i < n; i++) {
      const a = (i/n) * Math.PI*2 + frame * 0.05;
      demoBullets.push({
        x: dx, y: -8,
        vx: Math.cos(a) * spd * 0.25,
        vy: Math.abs(Math.sin(a)) * spd + 0.6,
        col: `hsl(${280 + i*18},72%,62%)`, r: 4
      });
    }
  }
  demoBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  demoBullets = demoBullets.filter(b => b.y < H+20 && b.x > -20 && b.x < W+20);
}
function drawMenuDemo() {
  ctx.globalAlpha = 0.28;
  demoBullets.forEach(b => {
    ctx.fillStyle = b.col;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ══════════════════════════════════════════════
// FLOW
// ══════════════════════════════════════════════
function onAction() {
  if (gs === 'menu') startGame();
  else if (gs === 'gameover') gs = 'menu';
}

function startGame() {
  gs = 'play';
  gf = 0; survivedF = 0; score = 0;
  wave = 0; waveTimerF = 0;
  grazeCount = 0; grazeFlash = 0;
  deathFlash = 0; waveIntroTimer = WAVE_INTRO_DUR;
  bullets = [];
  px = W/2; py = H - 90;
  pLives = MAX_LIVES; pInv = 0; pSlow = false;
  bossX = W/2; bossY = 68; bossMoveT = 0;
  roster = ROSTER[0].slice();
  Object.values(PAT).forEach(p => { p.t = p.iv(); });
}

// ══════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════
function update() {
  if (gs !== 'play') return;

  gf++;
  survivedF++;
  waveTimerF++;

  // Wave progression
  if (waveTimerF >= WAVE_DUR && wave < ROSTER.length - 1) {
    wave++;
    waveTimerF = 0;
    bullets = []; // 全弾消去してイントロへ
    roster = ROSTER[Math.min(wave, ROSTER.length-1)].slice();
    roster.forEach(name => { if (PAT[name]) PAT[name].t = PAT[name].iv(); });
    waveIntroTimer = WAVE_INTRO_DUR;
  }

  if (deathFlash    > 0) deathFlash--;
  if (grazeFlash    > 0) grazeFlash--;
  if (waveIntroTimer > 0) waveIntroTimer--;
  updateBoss();

  score = Math.floor(survivedF / 60) * 100 + grazeCount * 50;

  // ── Player movement ──
  const kbL = keys.has('ArrowLeft')  || keys.has('KeyA');
  const kbR = keys.has('ArrowRight') || keys.has('KeyD');
  const kbU = keys.has('ArrowUp')    || keys.has('KeyW');
  const kbD = keys.has('ArrowDown')  || keys.has('KeyS');
  const kbAny = kbL || kbR || kbU || kbD;

  pSlow = keys.has('ShiftLeft') || keys.has('ShiftRight') || mouseBtn;
  const spd = pSlow ? P_SLOW : P_SPD;

  let dx = 0, dy = 0;

  if (touchActive) {
    const d = Math.hypot(touchX - px, touchY - py);
    if (d > 3) { dx = (touchX-px)/d * Math.min(d, spd); dy = (touchY-py)/d * Math.min(d, spd); }
  } else if (kbAny) {
    if (kbL) dx -= spd;
    if (kbR) dx += spd;
    if (kbU) dy -= spd;
    if (kbD) dy += spd;
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
  } else if (mouseMoved) {
    const d = Math.hypot(mouseX - px, mouseY - py);
    if (d > 3) { dx = (mouseX-px)/d * Math.min(d, spd); dy = (mouseY-py)/d * Math.min(d, spd); }
  }

  px = Math.max(P_R, Math.min(W - P_R, px + dx));
  py = Math.max(P_R, Math.min(H - P_R, py + dy));

  if (pInv > 0) pInv--;

  // イントロ中はパターン発動・弾処理をスキップ
  if (waveIntroTimer > 0) return;

  // ── Fire patterns ──
  roster.forEach(name => {
    const p = PAT[name];
    if (!p) return;
    if (--p.t <= 0) { p.fn(); p.t = p.iv(); }
  });

  // ── Bullet physics + collision ──
  bullets.forEach(b => {
    b.x += b.vx;
    b.y += b.vy;
    if (b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20) { b.alive = false; return; }

    const d = Math.hypot(b.x - px, b.y - py);

    if (pInv === 0 && d < P_HIT_R + b.r) {
      b.alive = false;
      pLives--;
      pInv = INV_DUR;
      deathFlash = 22;
      if (pLives <= 0) {
        gs = 'gameover';
        saveHiScore({ score, wave: wave + 1, time: fmtTime(survivedF) });
      }
    } else if (!b.grazed && d < P_GRAZE_R + b.r) {
      b.grazed = true;
      grazeCount++;
      grazeFlash = 14;
    }
  });

  bullets = bullets.filter(b => b.alive);
}

// ══════════════════════════════════════════════
// DRAW HELPERS
// ══════════════════════════════════════════════
function drawBg() {
  ctx.fillStyle = '#060010';
  ctx.fillRect(0, 0, W, H);

  STARS.forEach(s => {
    s.y += s.spd;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawBoss() {
  const t = gf * 0.03;

  // Outer glow
  const g = ctx.createRadialGradient(bossX,bossY,0, bossX,bossY,B_R*3);
  g.addColorStop(0, 'rgba(255,60,180,0.35)');
  g.addColorStop(1, 'rgba(255,60,180,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(bossX, bossY, B_R*3, 0, Math.PI*2); ctx.fill();

  // Spinning petals
  ctx.save();
  ctx.translate(bossX, bossY);
  for (let i = 0; i < 6; i++) {
    const a = t + i/6 * Math.PI*2;
    ctx.save();
    ctx.rotate(a);
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = `hsl(${300+i*18},80%,58%)`;
    ctx.beginPath();
    ctx.ellipse(B_R*1.3, 0, B_R*0.85, B_R*0.28, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Core
  const g2 = ctx.createRadialGradient(bossX,bossY,0, bossX,bossY,B_R);
  g2.addColorStop(0, '#ffccee');
  g2.addColorStop(0.55, '#ff44aa');
  g2.addColorStop(1,    '#bb0055');
  ctx.fillStyle = g2;
  ctx.beginPath(); ctx.arc(bossX, bossY, B_R, 0, Math.PI*2); ctx.fill();

  // Eye
  ctx.fillStyle = '#220011';
  ctx.beginPath(); ctx.arc(bossX, bossY, B_R*0.4, 0, Math.PI*2); ctx.fill();
  const pulse = 0.12 + 0.04 * Math.sin(frame * 0.15);
  ctx.fillStyle = '#ff0044';
  ctx.beginPath(); ctx.arc(bossX, bossY, B_R*pulse*3, 0, Math.PI*2); ctx.fill();
}

function drawPlayer() {
  if (pInv > 0 && Math.floor(pInv / 5) % 2) return;

  const t = gf * 0.07;

  // Slow-mode aura
  if (pSlow) {
    const g = ctx.createRadialGradient(px,py,0, px,py,P_R+10);
    g.addColorStop(0, 'rgba(80,180,255,0.45)');
    g.addColorStop(1, 'rgba(80,180,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, P_R+10, 0, Math.PI*2); ctx.fill();
  }

  // Outer ring
  ctx.strokeStyle = pSlow ? '#80ccff' : '#4477aa';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(px, py, P_R, 0, Math.PI*2); ctx.stroke();

  // Rotating dots
  const dotCol = pSlow ? '#aaddff' : '#5588bb';
  for (let i = 0; i < 4; i++) {
    const a = t + i * Math.PI / 2;
    ctx.fillStyle = dotCol;
    ctx.beginPath(); ctx.arc(px + Math.cos(a)*P_R*0.65, py + Math.sin(a)*P_R*0.65, 2.5, 0, Math.PI*2); ctx.fill();
  }

  // Ship body (arrow shape)
  ctx.fillStyle = pSlow ? '#aaddff' : '#7799cc';
  ctx.beginPath();
  ctx.moveTo(px,             py - P_R*0.6);
  ctx.lineTo(px + P_R*0.45, py + P_R*0.45);
  ctx.lineTo(px,             py + P_R*0.2);
  ctx.lineTo(px - P_R*0.45, py + P_R*0.45);
  ctx.closePath();
  ctx.fill();

  // Hitbox indicator
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(px, py, P_HIT_R, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff3355';
  ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI*2); ctx.fill();

  // Graze ring flash
  if (grazeFlash > 0) {
    ctx.strokeStyle = `rgba(255,240,60,${grazeFlash/14})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py, P_GRAZE_R + 6, 0, Math.PI*2); ctx.stroke();
  }
}

function drawCircleBullet(b) {
  const g = ctx.createRadialGradient(b.x,b.y,0, b.x,b.y,b.r*2.5);
  g.addColorStop(0, b.col + 'bb');
  g.addColorStop(1, b.col + '00');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r*2.5, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = b.col;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.38, 0, Math.PI*2); ctx.fill();
}

function drawNeedle(b) {
  const angle = Math.atan2(b.vy, b.vx);
  const hw = (b.len || 18) / 2; // half-length
  const hr = b.r;               // half-width

  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(angle);

  // Soft outer glow (linear gradient along length)
  const glowG = ctx.createLinearGradient(-hw, 0, hw, 0);
  glowG.addColorStop(0,   b.col + '00');
  glowG.addColorStop(0.2, b.col + '66');
  glowG.addColorStop(0.8, b.col + '66');
  glowG.addColorStop(1,   b.col + '00');
  ctx.fillStyle = glowG;
  ctx.fillRect(-hw, -hr*2.5, hw*2, hr*5);

  // Capsule body
  ctx.fillStyle = b.col;
  ctx.beginPath();
  ctx.moveTo(-hw + hr, -hr);
  ctx.lineTo( hw - hr, -hr);
  ctx.arc( hw - hr, 0, hr, -Math.PI/2, Math.PI/2);
  ctx.lineTo(-hw + hr, hr);
  ctx.arc(-hw + hr, 0, hr, Math.PI/2, -Math.PI/2);
  ctx.closePath();
  ctx.fill();

  // Bright center line
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = hr * 0.55;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-hw * 0.75, 0);
  ctx.lineTo( hw * 0.75, 0);
  ctx.stroke();

  ctx.restore();
}

function drawBullets() {
  bullets.forEach(b => {
    if (b.shape === 'needle') drawNeedle(b);
    else drawCircleBullet(b);
  });
}

function fmtTime(f) {
  const s = Math.floor(f / 60);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function drawHUD() {
  // Lives (♥ hearts)
  ctx.font = '18px serif';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < MAX_LIVES; i++) {
    ctx.fillStyle = i < pLives ? '#ff4466' : '#2a0f1a';
    ctx.fillText('♥', 8 + i*22, H - 17);
  }
  ctx.textBaseline = 'alphabetic';

  ctx.font = 'bold 13px monospace';

  // Time (top-left)
  ctx.textAlign = 'left';
  ctx.fillStyle = '#9988aa';
  ctx.fillText(fmtTime(survivedF), 8, 18);

  // Score (top-right)
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(score.toLocaleString(), W - 8, 18);

  // Wave (top-center)
  ctx.textAlign = 'center';
  ctx.fillStyle = '#aa88cc';
  ctx.font = '11px monospace';
  ctx.fillText('WAVE ' + (wave+1), W/2, 18);

  // Graze counter
  if (grazeCount > 0) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffee55';
    ctx.font = '11px monospace';
    ctx.fillText('かすり ' + grazeCount, W-8, 33);
  }

  // Death flash overlay
  if (deathFlash > 0) {
    ctx.fillStyle = `rgba(255,70,70,${(deathFlash/22)*0.45})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawWaveIntro() {
  const t    = waveIntroTimer;
  const D    = WAVE_INTRO_DUR;
  const word = WAVE_WORDS[Math.min(wave, WAVE_WORDS.length - 1)];

  // ── ダークオーバーレイ (フェードイン→維持→フェードアウト) ──
  const ovA = t > D-14 ? (D-t)/14 : t < 28 ? t/28 : 1;
  ctx.fillStyle = `rgba(2,0,8,${ovA * 0.94})`;
  ctx.fillRect(0, 0, W, H);

  // ── 衝撃フラッシュ (最初の14フレームだけ真っ赤) ──
  if (t > D - 14) {
    const fa = (t - (D-14)) / 14;
    ctx.fillStyle = `rgba(160,0,0,${fa * 0.82})`;
    ctx.fillRect(0, 0, W, H);
  }

  // ── テキストのアルファ ──
  const tA = t > D-8 ? 0 : t < 22 ? t/22 : 1;
  if (tA <= 0) return;

  // ── 文字サイズ (文字数に応じて調整) ──
  const fs = word.length <= 1 ? 144 : word.length <= 2 ? 100 : word.length <= 4 ? 68 : 52;

  // ── スケール: 叩きつけるように大→等倍にパチンと収束 ──
  const sc = (t > D-18 ? 1 + ((t-(D-18))/10) * 1.3 : 1) * (1 + Math.sin(gf*0.09)*0.013);

  ctx.save();
  ctx.globalAlpha = tA;
  ctx.translate(W/2, H/2 - 10);
  ctx.scale(sc, sc);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${fs}px serif`;

  // 最外グロー
  ctx.shadowBlur = 90;
  ctx.shadowColor = '#ff0000';
  ctx.fillStyle = '#1a0000';
  ctx.fillText(word, 0, 0);

  // 中グロー
  ctx.shadowBlur = 45;
  ctx.shadowColor = '#ff2200';
  ctx.fillStyle = '#aa0000';
  ctx.fillText(word, 0, 0);

  // 本体の赤
  ctx.shadowBlur = 18;
  ctx.shadowColor = '#ff6644';
  ctx.fillStyle = '#ee2222';
  ctx.fillText(word, 0, 0);

  // 細い白ハイライト (上端がちょっと白く光る)
  ctx.globalAlpha = tA * 0.45;
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffcccc';
  ctx.fillText(word, 0, -fs*0.06);

  ctx.restore();

  // ── WAVE番号を小さく下に ──
  ctx.globalAlpha = tA * 0.55;
  ctx.fillStyle = '#662222';
  ctx.font = '13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('── WAVE ' + (wave + 1) + ' ──', W/2, H/2 + fs/2 + 30);
  ctx.globalAlpha = 1;
}

function drawMenu() {
  drawBg();
  updateMenuDemo();
  drawMenuDemo();

  // CRT スキャンライン (薄め)
  ctx.fillStyle = 'rgba(0,0,0,0.09)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);

  // 外枠 (ベゼル風)
  ctx.strokeStyle = '#1a0828'; ctx.lineWidth = 4;
  ctx.strokeRect(3, 3, W-6, H-6);
  ctx.strokeStyle = '#3a0a50'; ctx.lineWidth = 1;
  ctx.strokeRect(8, 8, W-16, H-16);

  // ── タイトルロゴ ──
  ctx.save();
  ctx.textAlign = 'center';

  ctx.shadowBlur = 50; ctx.shadowColor = '#cc0055';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 56px serif';
  ctx.fillText('弾避け', W/2, 95);

  ctx.shadowBlur = 22; ctx.shadowColor = '#ff4488';
  ctx.fillStyle = '#ff88cc';
  ctx.font = 'bold 32px serif';
  ctx.fillText('練　習', W/2, 135);
  ctx.restore();

  // サブタイトル
  ctx.fillStyle = '#44bbdd';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('B U L L E T  H E L L  P R A C T I C E', W/2, 154);

  // セパレーター
  const sep = (y, col) => {
    ctx.fillStyle = col; ctx.fillRect(18, y, W-36, 1);
  };
  sep(164, '#ff44aa');

  // ── HI-SCORE ──
  ctx.fillStyle = '#ffee44';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('─  HI - SCORE  ─', W/2, 182);

  const rankCol = ['#ffdd44', '#aaaacc', '#bb7733'];
  const rankLbl = ['1ST', '2ND', '3RD'];

  if (hiScores.length === 0) {
    ctx.fillStyle = '#3a2248';
    ctx.font = '12px monospace';
    ctx.fillText('─  NO  DATA  YET  ─', W/2, 218);
  } else {
    hiScores.slice(0, 3).forEach((s, i) => {
      const y = 200 + i * 26;
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = rankCol[i] || '#556677';
      ctx.textAlign = 'left';  ctx.fillText(rankLbl[i], 26, y);
      ctx.textAlign = 'right'; ctx.fillText(s.score.toLocaleString(), W/2 + 10, y);
      ctx.fillStyle = '#445566';
      ctx.font = '11px monospace';
      ctx.fillText(`W${s.wave}  ${s.time}`, W - 24, y);
    });
  }

  sep(284, '#ff44aa');

  // ── 操作説明 ──
  const ctrls = [
    ['MOVE',  '矢印 / WASD / タッチ'],
    ['SLOW',  'Shift / マウスボタン'],
    ['GRAZE', '弾をかすれるとボーナス'],
  ];
  ctrls.forEach(([key, val], i) => {
    const y = 302 + i * 22;
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'left';  ctx.fillStyle = '#44ddff'; ctx.fillText(key, 26, y);
    ctx.font = '11px monospace';
    ctx.textAlign = 'right'; ctx.fillStyle = '#446677'; ctx.fillText(val, W - 24, y);
  });

  sep(372, '#ff44aa');

  // ── PRESS ANY KEY (2フレームごとに点滅) ──
  if (Math.floor(frame / 22) % 2 === 0) {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 17px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PRESS  ANY  KEY', W/2, 400);
  }
  ctx.fillStyle = '#332244';
  ctx.font = '11px monospace';
  ctx.fillText('タップ / クリック でもOK', W/2, 420);

  // ── 下部デコレーション ──
  ctx.fillStyle = '#ff44aa';
  ctx.font = '10px monospace';
  ctx.fillText('★  ───────────────────  ★', W/2, H - 28);
  ctx.fillStyle = '#1e0c28';
  ctx.font = '10px monospace';
  ctx.fillText('© 2026  BULLET HELL PRACTICE  1 CREDIT', W/2, H - 12);
}

function drawGameOver() {
  drawBg();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ff4466';
  ctx.font = 'bold 34px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W/2, H/2 - 100);

  const rows = [
    ['生存時間', fmtTime(survivedF)],
    ['スコア',   score.toLocaleString()],
    ['かすり',   grazeCount + ' 回'],
    ['WAVE',     String(wave + 1)],
  ];
  ctx.font = '15px monospace';
  rows.forEach(([k, v], i) => {
    ctx.textAlign = 'left';  ctx.fillStyle = '#776688'; ctx.fillText(k, W/2 - 80, H/2 - 35 + i*34);
    ctx.textAlign = 'right'; ctx.fillStyle = '#ffffff'; ctx.fillText(v, W/2 + 80, H/2 - 35 + i*34);
  });

  const pulse = 0.6 + 0.4 * Math.sin(frame * 0.07);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#ffee55';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('タップ / クリック / キーでリトライ', W/2, H/2 + 145);
  ctx.globalAlpha = 1;
}

// ══════════════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════════════
function loop() {
  frame++;
  update();

  if (gs === 'menu') {
    drawMenu();
  } else if (gs === 'gameover') {
    drawGameOver();
  } else {
    drawBg();
    drawBoss();
    drawBullets();
    drawPlayer();
    drawHUD();
    if (waveIntroTimer > 0) drawWaveIntro();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

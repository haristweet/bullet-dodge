<script>
'use strict';

const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = 360, H = 640;
C.width = W; C.height = H;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  C.style.width = W * s + 'px';
  C.style.height = H * s + 'px';
}
resize();
addEventListener('resize', resize);

// ══════════════════════════════════════════════
// INPUT
// ══════════════════════════════════════════════
const keys = new Set();
let mouseX = W/2, mouseY = H-90, mouseBtn = false, mouseMoved = false;
let touchActive = false, touchX = W/2, touchY = H-90;

// ── デバイス判定 ──
const isMobile = navigator.maxTouchPoints > 1 || /Mobi|Android/i.test(navigator.userAgent);

// ── コントロール選択 ──
let menuSel = 0;
let controlMode = isMobile ? 'touch' : 'keyboard';
let gpConnected = false;
let _gpPrevA = false, _gpPrevL = false, _gpPrevR = false, _gpPrevStart = false;
window.addEventListener('gamepadconnected',    () => { gpConnected = true; });
window.addEventListener('gamepaddisconnected', () => {
  gpConnected = !![...(navigator.getGamepads?.() || [])].find(g => g);
});

// 全カード定義
const _ALL_CARDS = [
  { id: 'keyboard', icon: '⌨', label: 'キーボード',   hint: '矢印 / WASD  Shift=低速',  pc: true,  sp: false },
  { id: 'mouse',    icon: '🖱', label: 'マウス',       hint: 'カーソル追従  ボタン=低速', pc: true,  sp: false },
  { id: 'touch',    icon: '👆', label: 'タッチ',       hint: '指でドラッグ',              pc: false, sp: true  },
  { id: 'gamepad',  icon: '🎮', label: 'ゲームパッド', hint: 'スティック  L1/R1=低速',   pc: true,  sp: true  },
];
// デバイスに合わせてカードを絞り込む
const CTRL_CARDS = _ALL_CARDS.filter(c => isMobile ? c.sp : c.pc);

// カードレイアウト定数（枚数に応じて動的算出）
const _CY1 = 296, _CY2 = 362, _CW = 96, _CGap = 8;
const _CX0 = (W - (_CW * CTRL_CARDS.length + _CGap * (CTRL_CARDS.length - 1))) / 2;

function canvasXY(cx, cy) {
  const r = C.getBoundingClientRect();
  return [(cx - r.left) * W / r.width, (cy - r.top) * H / r.height];
}

function _cardAt(cx, cy) {
  if (cy < _CY1 || cy > _CY2) return -1;
  for (let i = 0; i < CTRL_CARDS.length; i++) {
    const x = _CX0 + i * (_CW + _CGap);
    if (cx >= x && cx < x + _CW) return i;
  }
  return -1;
}

addEventListener('keydown', e => {
  e.preventDefault();
  if (e.code === 'Escape') { togglePause(); return; }
  if (gs === 'menu') {
    if (e.code === 'ArrowLeft'  || e.code === 'KeyA') { menuSel = (menuSel + 2) % 3; return; }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { menuSel = (menuSel + 1) % 3; return; }
  }
  keys.add(e.code);
  onAction();
});
addEventListener('keyup', e => keys.delete(e.code));

C.addEventListener('mousemove', e => {
  [mouseX, mouseY] = canvasXY(e.clientX, e.clientY);
  mouseMoved = true;
  mouseBtn = (e.buttons & 1) !== 0;
});
C.addEventListener('mousedown', e => {
  mouseBtn = true;
  const [cx, cy] = canvasXY(e.clientX, e.clientY);
  if (gs === 'menu') {
    const card = _cardAt(cx, cy);
    if (card >= 0) { menuSel = card; return; } // カード選択のみ、ゲーム開始しない
  }
  onAction();
});
C.addEventListener('mouseup', () => mouseBtn = false);

C.addEventListener('touchstart', e => {
  e.preventDefault();
  [touchX, touchY] = canvasXY(e.touches[0].clientX, e.touches[0].clientY);
  touchActive = true;
  if (gs === 'menu') {
    const card = _cardAt(touchX, touchY);
    if (card >= 0) { menuSel = card; return; }
  }
  onAction();
}, { passive: false });
C.addEventListener('touchmove', e => {
  e.preventDefault();
  [touchX, touchY] = canvasXY(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
C.addEventListener('touchend', e => {
  if (!e.touches.length) touchActive = false;
}, { passive: false });

let gs = 'menu'; // menu | play | gameover | pause

// Boss (dynamic position)
const B_R = 26;
let bossX = W / 2, bossY = 68, bossMoveT = 0;

// ボス移動パターン (wave/2 のインデックスで切り替え)
const BOSS_MOVES = [
  // 0: ゆったり正弦波ドリフト (wave 1-2)
  t => {
    bossX = W/2 + Math.sin(t * 0.018) * 65;
    bossY = 70  + Math.sin(t * 0.011) * 12;
  },
  // 1: 横幅広めのスウィープ (wave 3-4)
  t => {
    bossX = W/2 + Math.sin(t * 0.030) * 105;
    bossY = 70  + Math.sin(t * 0.017) * 18;
  },
  // 2: 8の字 (wave 5-6)
  t => {
    bossX = W/2 + Math.sin(t * 0.040) * 115;
    bossY = 70  + Math.sin(t * 0.080) * 28;
  },
  // 3: 多周波の不規則移動 (wave 7-8)
  t => {
    bossX = W/2 + Math.sin(t * 0.055) * 115 + Math.sin(t * 0.120 + 2) * 35;
    bossY = 62  + Math.abs(Math.sin(t * 0.036)) * 48;
  },
  // 4: 最大カオス (wave 9-10)
  t => {
    bossX = W/2 + Math.sin(t * 0.072) * 125 + Math.sin(t * 0.190 + 1) * 42;
    bossY = 55  + Math.sin(t * 0.050) * 50   + Math.sin(t * 0.095) * 18;
  },
];

function updateBoss() {
  bossMoveT++;
  const idx = Math.min(Math.floor(wave / 2), BOSS_MOVES.length - 1);
  BOSS_MOVES[idx](bossMoveT);
  bossX = Math.max(B_R + 8, Math.min(W - B_R - 8, bossX));
  bossY = Math.max(38,       Math.min(130,          bossY));
}

// ══════════════════════════════════════════════
// BULLET PATTERNS
// ══════════════════════════════════════════════
function bul(x, y, vx, vy, r, col) {
  return { x, y, vx, vy, r: r||5, col: col||'#ff4466', alive: true, grazed: false };
}
function ring(x, y, n, spd, r, col, off) {
  off = off || 0;
  for (let i = 0; i < n; i++) {
    const a = off + i / n * Math.PI * 2;
    bullets.push(bul(x, y, Math.cos(a)*spd, Math.sin(a)*spd, r, col));
  }
}
function aimed(x, y, spd, spread, r, col) {
  const n = spread > 0 ? 3 : 1;
  const a0 = Math.atan2(py - y, px - x);
  for (let i = 0; i < n; i++) {
    const a = a0 + (i - Math.floor(n/2)) * (spread || 0);
    bullets.push(bul(x, y, Math.cos(a)*spd, Math.sin(a)*spd, r, col));
  }
}
function needle(x, y, vx, vy, len, col) {
  return { x, y, vx, vy, r: 2.5, col: col||'#ffffff', alive: true, grazed: false, shape: 'needle', len: len||18 };
}

const PAT = {
  ring: {
    t: 0,
    iv() { return Math.max(58 - wave*3, 28); },
    fn() {
      const n   = Math.min(14 + wave*2, 32);
      const spd = 1.8 + wave*0.12;
      ring(bossX, bossY, n, spd, 5, '#ff6699', gf*0.04);
    }
  },
  spiral: {
    t: 0,
    iv() { return Math.max(7 - Math.floor(wave*0.4), 4); },
    fn() {
      const arms = 3 + Math.floor(wave/3);
      const spd  = 2.2 + wave*0.12;
      for (let i = 0; i < arms; i++) {
        const a = gf*0.12 + i/arms*Math.PI*2;
        bullets.push(bul(bossX, bossY, Math.cos(a)*spd, Math.sin(a)*spd, 5, '#ffaa44'));
      }
    }
  },
  aimed: {
    t: 0,
    iv() { return Math.max(58 - wave*3, 25); },

  scatter: {
    t: 0,
    iv() { return Math.max(40 - wave*2, 18); },
    fn() {
      const n   = 4 + Math.floor(wave*1.2);
      const spd = 2.0 + wave*0.12;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        bullets.push(bul(bossX, bossY, Math.cos(a)*spd, Math.sin(a)*spd, 4, '#cc44ff'));

  sweep: {
    t: 0,

        const a = -Math.PI/2 + Math.sin(gf*0.06 + i*1.2) * 0.9;

      }
    }
  },
  cross: {
    t: 0,
    iv() { return Math.max(18 - wave, 9); },
    fn() {
      const spd = 2.8 + wave*0.15;
      for (let i = 0; i < 4; i++) {
        const a = i/4 * Math.PI*2 + gf*0.025;
        bullets.push(bul(bossX, bossY, Math.cos(a)*spd, Math.sin(a)*spd, 5, '#44ffaa'));
      }
    }
  },
  flower: {
    t: 0,
    iv() { return Math.max(13 - Math.floor(wave*0.3), 7); },
    fn() {
      const n   = 8;
      const spd = 2.2 + wave*0.12;
      const t   = gf * 0.05;
      for (let i = 0; i < n; i++) {
        const a = i/n * Math.PI*2 + t;
        const s = 0.5 + 0.5 * Math.abs(Math.sin(n/2 * a));
        bullets.push(bul(bossX, bossY, Math.cos(a)*spd*s, Math.sin(a)*spd*s, 5, '#ff88ff'));
      }
    }
  },
  burst: {
    t: 0,
    iv() { return Math.max(65 - wave*3, 28); },
    fn() {
      const n   = 7 + wave;
      const spd = 2.8 + wave*0.18;
      const a0  = Math.atan2(py - bossY, px - bossX);
      for (let i = 0; i < n; i++) {
        const a = a0 + (i - Math.floor(n/2)) * 0.18;
        bullets.push(bul(bossX, bossY, Math.cos(a)*spd, Math.sin(a)*spd, 5, '#00ffff'));
      }
    }
  },

  // ── 針弾パターン ──────────────────────────────
  needle_fan: {
    t: 0,
    iv() { return Math.max(80 - wave*3, 45); },
    fn() {
      const n      = Math.min(22 + wave*3, 52);
      const spd    = 2.5 + wave*0.15;
      const spread = Math.PI * 0.85;
      const a0     = Math.atan2(py - bossY, px - bossX);
      for (let i = 0; i < n; i++) {
        const a = a0 - spread/2 + i/(n-1) * spread;
        bullets.push(needle(bossX, bossY, Math.cos(a)*spd, Math.sin(a)*spd, 20, '#ffffff'));
      }
    }
  },

  needle_wall: {
    t: 0,
    iv() { return Math.max(90 - wave*4, 50); },
    fn() {
      const n   = 9 + Math.floor(wave*1.5);
      const spd = 3.0 + wave*0.18;
      for (let i = 0; i < n; i++) {
        const x  = (i + 0.5) / n * W;
        const vx = (Math.random() - 0.5) * 0.4;
        bullets.push(needle(x, bossY + 15, vx, spd, 22, '#88ffff'));
      }
    }
  },

  needle_rain: {
    t: 0,
    iv() { return Math.max(10 - Math.floor(wave*0.3), 5); },
    fn() {
      const x   = Math.random() * W;
      const spd = 3.0 + wave*0.15;
      const a   = -Math.PI/2 + (Math.random() - 0.5) * 0.7;
      bullets.push(needle(x, -5, Math.cos(a)*spd, Math.sin(a)*spd, 16, '#ffeeaa'));
    }
  },

  needle_ring: {
    t: 0,
    iv() { return Math.max(38 - wave*2, 18); },
    fn() {
      const n   = Math.min(12 + wave*2, 30);
      const spd = 2.2 + wave*0.15;
      const off = gf * 0.07;
      for (let i = 0; i < n; i++) {
        const a = off + i/n * Math.PI*2;
        bullets.push(needle(bossX, bossY, Math.cos(a)*spd, Math.sin(a)*spd, 20, '#aaffcc'));
      }
    }
  },
};

// ═══ SE (効果音) ════════════════════════════
const SE = (() => {
  function ctx() {
    return window._audioCtx || (window._audioCtx = new (window.AudioContext || window.webkitAudioContext)());
  }
  function note(hz, type, vol, dur, t) {
    const c = ctx(), st = t || c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.value = hz;
    g.gain.setValueAtTime(vol, st);
    g.gain.exponentialRampToValueAtTime(0.001, st + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start(st);
    o.stop(st + dur + 0.01);
  }
  return {
    hit: () => note(800, 'triangle', 0.15, 0.08),
    shoot: () => note(600, 'square', 0.08, 0.04),
    power: () => note(1200, 'square', 0.2, 0.2),
    bosshit: () => note(400, 'sawtooth', 0.25, 0.4),
    dead: () => note(200, 'square', 0.25, 0.5),
  };
})();

// ═══ PSG (BGM) ══════════════════════════════
const PSG = (() => {
  let AC, mGain, seqId, nextT, step, bpm;
  function ctx() { return AC || (AC = new (window.AudioContext || window.webkitAudioContext)()); }
  function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  function noteOn(hz, type, vol, t, dur) {
    const c = ctx();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.value = hz;
    g.gain.setValueAtTime(vol, t);
    g.gain.setValueAtTime(vol * 0.5, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.95);
    o.connect(g);
    g.connect(mGain);
    o.start(t);
    o.stop(t + dur + 0.01);
  }
  return {
    play(st) {
      this.stop();
      ctx();
      if (!mGain) { mGain = AC.createGain(); mGain.gain.value = 0.15; mGain.connect(AC.destination); }
      const zoneIdx = Math.min(4, Math.floor((st - 1) / 2));
      const bmps = [100, 120, 140, 160, 180];
      bpm = bmps[zoneIdx];
      const scales = [[60,62,64,65,67,69,71],[60,62,64,65,67,69,71],[60,62,64,65,67,69,70],[60,62,63,65,67,69,70],[60,62,64,65,67,69,71]];
      const sc = scales[zoneIdx];
      const mel = [sc[0], null, sc[2], sc[4], sc[3], sc[2], sc[1], null];
      const bas = [sc[0], null, sc[0], null, sc[4], null, sc[0], null];
      step = 0;
      nextT = ctx().currentTime + 0.08;
      const sd = (60 / bpm / 2);
      seqId = setInterval(() => {
        while (nextT < AC.currentTime + 0.18) {
          const i = step % mel.length;
          if (mel[i] !== null) noteOn(midi(mel[i] + 24), 'square', 0.12, nextT, sd * 0.7);
          if (bas[i] !== null) noteOn(midi(bas[i] + 12), 'triangle', 0.18, nextT, sd * 1.4);
          step++;
          nextT += sd;
        }
      }, 25);
    },
    stop() { if (seqId) { clearInterval(seqId); seqId = null; } },
    resume() { if (AC && AC.state === 'suspended') AC.resume(); },
    suspend() { if (AC && AC.state === 'running') AC.suspend(); }

let hiScores = [];
function loadHiScores() {
  try { hiScores = JSON.parse(localStorage.getItem('bhd_hi') || '[]'); }
  catch(e) { hiScores = []; }
}
function saveHiScore(entry) {
  loadHiScores();
  hiScores.push(entry);
  hiScores.sort((a, b) => b.score - a.score);
  hiScores = hiScores.slice(0, 5);
  localStorage.setItem('bhd_hi', JSON.stringify(hiScores));
}
loadHiScores();

// MENU DEMO BULLETS (タイトル画面の背景装飾)
// ══════════════════════════════════════════════
let demoBullets = [];
let demoFireT = 0;

function updateMenuDemo() {
  demoFireT--;
  if (demoFireT <= 0) {
    demoFireT = 45;
    const dx = W/2 + Math.sin(frame * 0.013) * 100;
    const n = 18, spd = 1.1;
    for (let i = 0; i < n; i++) {
      const a = (i/n) * Math.PI*2 + frame * 0.05;
      demoBullets.push({
        x: dx, y: -8,
        vx: Math.cos(a) * spd * 0.25,
        vy: Math.abs(Math.sin(a)) * spd + 0.6,
        col: `hsl(${280 + i*18},72%,62%)`, r: 4
      });
    }
  }
  demoBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  demoBullets = demoBullets.filter(b => b.y < H+20 && b.x > -20 && b.x < W+20);
}
function drawMenuDemo() {
  ctx.globalAlpha = 0.28;
  demoBullets.forEach(b => {
    ctx.fillStyle = b.col;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function onAction() {
  if (gs === 'menu') {
    controlMode = CTRL_CARDS[menuSel].id;
    startGame();
  } else if (gs === 'gameover') gs = 'menu';
}

// ポーズ ⇔ カウントダウン再開のトグル
function togglePause() {
  if (gs === 'play') {
    gs = 'pause';
    PSG.suspend();
  } else if (gs === 'pause') {
    gs = 'countdown';
    pauseTimer = 180;   // 3秒カウントダウン (60fps)
    PSG.resume();
  }
  // countdown 中の入力は無視
}

function startGame() {
  gs = 'play';
  gf = 0; survivedF = 0; score = 0;
  wave = 0; waveTimerF = 0;
  grazeCount = 0; grazeFlash = 0;
  deathFlash = 0; waveIntroTimer = WAVE_INTRO_DUR;
  bullets = [];
  px = W/2; py = H - 90;
  pLives = MAX_LIVES; pInv = 0; pSlow = false;
  bossX = W/2; bossY = 68; bossMoveT = 0;
  roster = ROSTER[0].slice();
  Object.values(PAT).forEach(p => { p.t = p.iv(); });
  pauseTimer = 0;
  PSG.play(1);
}

// ══════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════
function update() {
  // カウントダウン中: ゲーム進行は凍結、タイマーのみ進める
  if (gs === 'countdown') {
    if (--pauseTimer <= 0) { gs = 'play'; pauseTimer = 0; }
    return;
  }
  if (gs !== 'play') return;

  gf++;
  survivedF++;
  waveTimerF++;

  // Wave progression
  if (waveTimerF >= WAVE_DUR && wave < ROSTER.length - 1) {
    wave++;
    waveTimerF = 0;
    bullets = []; // 全弾消去してイントロへ
    roster = ROSTER[Math.min(wave, ROSTER.length-1)].slice();
    roster.forEach(name => { if (PAT[name]) PAT[name].t = PAT[name].iv(); });
    waveIntroTimer = WAVE_INTRO_DUR;
    if ((wave + 1) % 2 === 1) PSG.play(wave + 1); // ゾーン切替時のみBGM変更
  }

  if (deathFlash    > 0) deathFlash--;
  if (grazeFlash    > 0) grazeFlash--;
  if (waveIntroTimer > 0) waveIntroTimer--;
  updateBoss();

  score = Math.floor(survivedF / 60) * 100 + grazeCount * 50;

  // ── Player movement ──
  let dx = 0, dy = 0;

  if (controlMode === 'gamepad') {
    const gp = (navigator.getGamepads?.() || [])[0];
    pSlow = gp ? (gp.buttons[4]?.pressed || gp.buttons[5]?.pressed) : false;
    const spd = pSlow ? P_SLOW : P_SPD;
    if (gp) {
      const dead = 0.15;
      const ax = gp.axes[0], ay = gp.axes[1];
      if (Math.abs(ax) > dead) dx = ax * spd;
      if (Math.abs(ay) > dead) dy = ay * spd;
    }
  } else if (controlMode === 'touch') {
    pSlow = (touchActive && keys.has('ShiftLeft')); // touch では基本 pSlow なし
    const spd = pSlow ? P_SLOW : P_SPD;
    if (touchActive) {
      const d = Math.hypot(touchX - px, touchY - py);
      if (d > 3) { dx = (touchX-px)/d * Math.min(d, spd); dy = (touchY-py)/d * Math.min(d, spd); }
    }
  } else if (controlMode === 'mouse') {
    pSlow = mouseBtn;
    const spd = pSlow ? P_SLOW : P_SPD;
    if (touchActive) {
      const d = Math.hypot(touchX - px, touchY - py);
      if (d > 3) { dx = (touchX-px)/d * Math.min(d, spd); dy = (touchY-py)/d * Math.min(d, spd); }
    } else {
      const d = Math.hypot(mouseX - px, mouseY - py);
      if (d > 3) { dx = (mouseX-px)/d * Math.min(d, spd); dy = (mouseY-py)/d * Math.min(d, spd); }
    }
  } else { // keyboard
    pSlow = keys.has('ShiftLeft') || keys.has('ShiftRight');
    const spd = pSlow ? P_SLOW : P_SPD;
    const kbL = keys.has('ArrowLeft')  || keys.has('KeyA');
    const kbR = keys.has('ArrowRight') || keys.has('KeyD');
    const kbU = keys.has('ArrowUp')    || keys.has('KeyW');
    const kbD = keys.has('ArrowDown')  || keys.has('KeyS');
    if (kbL) dx -= spd;
    if (kbR) dx += spd;
    if (kbU) dy -= spd;
    if (kbD) dy += spd;
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
  }

  px = Math.max(P_R, Math.min(W - P_R, px + dx));
  py = Math.max(P_R, Math.min(H - P_R, py + dy));

  if (pInv > 0) pInv--;

  // イントロ中はパターン発動・弾処理をスキップ
  if (waveIntroTimer > 0) return;

  // ── Fire patterns ──
  roster.forEach(name => {
    const p = PAT[name];
    if (!p) return;
    if (--p.t <= 0) { p.fn(); p.t = p.iv(); }
  });

  // ── Bullet physics + collision ──
  bullets.forEach(b => {
    b.x += b.vx;
    b.y += b.vy;
    if (b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20) { b.alive = false; return; }

    const d = Math.hypot(b.x - px, b.y - py);

    if (pInv === 0 && d < P_HIT_R + b.r) {
      b.alive = false;
      pLives--;
      pInv = INV_DUR;
      deathFlash = 22;
      if (pLives <= 0) {
        gs = 'gameover';
        SE.dead();
        PSG.stop();
        saveHiScore({ score, wave: wave + 1, time: fmtTime(survivedF) });
      } else {
        SE.hit();
      }
    } else if (!b.grazed && d < P_GRAZE_R + b.r) {
      b.grazed = true;
      grazeCount++;
      grazeFlash = 14;
      SE.shoot(); // かすり音 (軽いブリップ)
    }
  });

  bullets = bullets.filter(b => b.alive);
}

// ── タイルオーバーレイ（全背景共通） ──────────
function drawTileOverlay(alpha) {
  if (!bgTileImg.complete) return;
  const off = Math.floor(frame * 0.5) % TILE_S;
  ctx.globalAlpha = alpha;
  for (let ty = -TILE_S + off; ty < H + TILE_S; ty += TILE_S)
    for (let tx = 0; tx < W + TILE_S; tx += TILE_S)
      ctx.drawImage(bgTileImg, tx, ty, TILE_S, TILE_S);
  ctx.globalAlpha = 1;
}

// ── 0: 宇宙 ──────────────────────────────────
function drawBgSpace() {
  ctx.fillStyle = '#060010';
  ctx.fillRect(0, 0, W, H);
  drawTileOverlay(0.18);
  STARS.forEach(s => {
    s.y += s.spd;
    if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ── 1: 高空（青空・雲） ───────────────────────
function drawBgSky() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#060e2a'); g.addColorStop(0.45, '#1460a8'); g.addColorStop(1, '#4a9dd8');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  drawTileOverlay(0.10);
  // 星（薄く）
  STARS.forEach(s => {
    s.y += s.spd * 0.4;
    if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
    ctx.globalAlpha = s.a * 0.25;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  // 雲
  BG_CLOUDS.forEach(c => {
    c.y += c.spd;
    if (c.y > H + c.h) c.y = -c.h;
    ctx.globalAlpha = c.a;
    ctx.fillStyle = '#d8eeff';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w/2, c.h/2, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x-c.w*0.22, c.y-c.h*0.18, c.w*0.28, c.h*0.4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x+c.w*0.22, c.y-c.h*0.12, c.w*0.24, c.h*0.35, 0, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ── 2: 森（樹冠を俯瞰） ───────────────────────
function drawBgForest() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#060e04'); g.addColorStop(0.5,'#122810'); g.addColorStop(1,'#1e3e18');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  drawTileOverlay(0.12);
  BG_TREES.forEach(t => {
    t.y += t.spd;
    if (t.y > H+t.r) { t.y = -t.r; t.x = Math.random()*W; }
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#060a04';
    ctx.beginPath(); ctx.arc(t.x+3,t.y+4,t.r,0,Math.PI*2); ctx.fill();  // 影
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = `hsl(${t.hue},48%,${t.li}%)`;
    ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = `hsl(${t.hue+10},60%,${t.li+14}%)`;
    ctx.beginPath(); ctx.arc(t.x-t.r*0.22,t.y-t.r*0.22,t.r*0.48,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ── 3: 海（波面を俯瞰） ───────────────────────
function drawBgOcean() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#01081a'); g.addColorStop(0.5,'#042c5e'); g.addColorStop(1,'#085080');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  drawTileOverlay(0.14);
  // 波ライン
  for (let i = 0; i < 14; i++) {
    const baseY = ((i/14)*H + frame*0.55) % H;
    ctx.strokeStyle = `rgba(80,160,230,${0.12+i%3*0.06})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, baseY);
    for (let x = 0; x <= W; x += 6)
      ctx.lineTo(x, baseY + Math.sin(x*0.03 + frame*0.04 + i*1.1)*4);
    ctx.stroke();
  }
  // 光の反射（小さい白点）
  STARS.forEach(s => {
    s.y += s.spd*0.7;
    if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
    ctx.globalAlpha = s.a * 0.4;
    ctx.fillStyle = '#a0d8f0';
    ctx.fillRect(s.x, s.y, 1.2, 1.2);
  });
  ctx.globalAlpha = 1;
}

// ── 4: 市街地夜景 ─────────────────────────────
function drawBgCity() {
  ctx.fillStyle = '#04040c';
  ctx.fillRect(0,0,W,H);
  drawTileOverlay(0.20);
  // 道路グリッド
  const scroll = (frame*0.5) % 80;
  ctx.fillStyle = 'rgba(30,30,55,0.7)';
  for (let y = scroll-80; y < H; y += 80) ctx.fillRect(0,y,W,2);
  for (let x = 0; x < W; x += 72) ctx.fillRect(x,0,2,H);
  // ビル（行×列の決定論的生成）
  for (let row = -1; row < 7; row++) {
    const ry = ((row*100 + scroll*1.2) % (H+120)) - 60;
    for (let col = 0; col < 5; col++) {
      const seed = (row*17 + col*31) & 0xff;
      const bx   = col*72 + (seed%28) + 4;
      const bw   = 30 + seed%28;
      const bh   = 45 + seed%65;
      const by   = ry - bh/2;
      ctx.fillStyle = `rgb(${12+seed%10},${12+seed%10},${22+seed%12})`;
      ctx.fillRect(bx, by, bw, bh);
      // 窓
      for (let wy2 = by+4; wy2 < by+bh-4; wy2 += 9) {
        for (let wx2 = bx+3; wx2 < bx+bw-3; wx2 += 7) {
          const ws = (wx2*3+wy2*7+seed) % 100;
          if (ws > 28) {
            ctx.fillStyle = `rgba(255,${190+ws%60},${60+ws%40},0.75)`;
            ctx.fillRect(wx2, wy2, 3, 4);
          }
        }
      }
    }
  }
  // 都市の環境光
  const cityGlow = ctx.createLinearGradient(0,0,0,H);
  cityGlow.addColorStop(0,'rgba(60,10,160,0.06)');
  cityGlow.addColorStop(0.5,'rgba(200,80,10,0.04)');
  cityGlow.addColorStop(1,'rgba(60,10,160,0.06)');
  ctx.fillStyle = cityGlow; ctx.fillRect(0,0,W,H);
}

// ── 背景ディスパッチャー ─────────────────────
function drawBg() {
  [drawBgSpace, drawBgSky, drawBgForest, drawBgOcean, drawBgCity][getBgIdx()]();
}

function drawBoss() {
  const size = Math.round(96 * (1 + wave * 0.1)); // WAVE毎に10%ずつ巨大化

  // 外側グロー（スプライトを背景から浮かせる）
  const pulse = 0.5 + 0.5 * Math.sin(gf * 0.07);
  const glowR = size * 0.65;
  const g = ctx.createRadialGradient(bossX, bossY, 0, bossX, bossY, glowR);
  g.addColorStop(0,   `rgba(40,80,255,${0.3 + pulse * 0.15})`);
  g.addColorStop(0.6, 'rgba(20,40,180,0.1)');
  g.addColorStop(1,   'rgba(0,0,100,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(bossX, bossY, glowR, 0, Math.PI*2); ctx.fill();

  // スプライト描画（96×96px、brightness で青いグローを強調）
  if (bossImg.complete) {
    ctx.imageSmoothingEnabled = true;
    ctx.filter = 'brightness(2.0) contrast(1.1)';
    ctx.drawImage(bossImg,
      Math.round(bossX - size/2),
      Math.round(bossY - size/2),
      size, size);
    ctx.filter = 'none';
  }
}

function drawPlayer() {
  if (pInv > 0 && Math.floor(pInv / 5) % 2) return;

  // 低速モードのオーラ
  if (pSlow) {
    const g = ctx.createRadialGradient(px,py,0, px,py,P_R+10);
    g.addColorStop(0, 'rgba(80,180,255,0.45)');
    g.addColorStop(1, 'rgba(80,180,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, P_R+10, 0, Math.PI*2); ctx.fill();
  }

  // スプライトの後ろに発光グロー（暗いスプライトを背景から浮かせる）
  const glowR = 36;
  const glow = ctx.createRadialGradient(px, py, 0, px, py, glowR);
  glow.addColorStop(0,   'rgba(60,120,255,0.35)');
  glow.addColorStop(0.6, 'rgba(40,80,200,0.15)');
  glow.addColorStop(1,   'rgba(20,40,150,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(px, py, glowR, 0, Math.PI*2); ctx.fill();

  // スプライト 43×43px 表示 (暗い画像を brightness で補正)
  const size = 43;
  ctx.imageSmoothingEnabled = true;
  if (spriteImg.complete) {
    ctx.filter = 'brightness(3.5) contrast(1.2)';
    ctx.drawImage(spriteImg, Math.round(px - size/2), Math.round(py - size/2), size, size);
    ctx.filter = 'none';
  }

  // 当たり判定ドット (スプライトの上に重ねる)
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(px, py, P_HIT_R, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff3355';
  ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI*2); ctx.fill();

  // かすりフラッシュ
  if (grazeFlash > 0) {
    ctx.strokeStyle = `rgba(255,240,60,${grazeFlash/14})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py, P_GRAZE_R + 6, 0, Math.PI*2); ctx.stroke();
  }
}

function drawCircleBullet(b) {
  const g = ctx.createRadialGradient(b.x,b.y,0, b.x,b.y,b.r*2.5);
  g.addColorStop(0, b.col + 'bb');
  g.addColorStop(1, b.col + '00');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r*2.5, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = b.col;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.38, 0, Math.PI*2); ctx.fill();
}

function drawNeedle(b) {
  const angle = Math.atan2(b.vy, b.vx);
  const hw = (b.len || 18) / 2; // half-length
  const hr = b.r;               // half-width

  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(angle);

  // Soft outer glow (linear gradient along length)
  const glowG = ctx.createLinearGradient(-hw, 0, hw, 0);
  glowG.addColorStop(0,   b.col + '00');
  glowG.addColorStop(0.2, b.col + '66');
  glowG.addColorStop(0.8, b.col + '66');
  glowG.addColorStop(1,   b.col + '00');
  ctx.fillStyle = glowG;
  ctx.fillRect(-hw, -hr*2.5, hw*2, hr*5);

  // Capsule body
  ctx.fillStyle = b.col;
  ctx.beginPath();
  ctx.moveTo(-hw + hr, -hr);
  ctx.lineTo( hw - hr, -hr);
  ctx.arc( hw - hr, 0, hr, -Math.PI/2, Math.PI/2);
  ctx.lineTo(-hw + hr, hr);
  ctx.arc(-hw + hr, 0, hr, Math.PI/2, -Math.PI/2);
  ctx.closePath();
  ctx.fill();

  // Bright center line
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = hr * 0.55;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-hw * 0.75, 0);
  ctx.lineTo( hw * 0.75, 0);
  ctx.stroke();

  ctx.restore();
}

function drawBullets() {
  bullets.forEach(b => {
    if (b.shape === 'needle') drawNeedle(b);
    else drawCircleBullet(b);
  });
}

function fmtTime(f) {
  const s = Math.floor(f / 60);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function drawHUD() {
  // Lives (♥ hearts)
  ctx.font = '18px serif';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < MAX_LIVES; i++) {
    ctx.fillStyle = i < pLives ? '#ff4466' : '#2a0f1a';
    ctx.fillText('♥', 8 + i*22, H - 17);
  }
  ctx.textBaseline = 'alphabetic';

  ctx.font = 'bold 13px monospace';

  // Time (top-left)
  ctx.textAlign = 'left';
  ctx.fillStyle = '#9988aa';
  ctx.fillText(fmtTime(survivedF), 8, 18);

  // Score (top-right)
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(score.toLocaleString(), W - 8, 18);

  // Wave (top-center)
  ctx.textAlign = 'center';
  ctx.fillStyle = '#aa88cc';
  ctx.font = '11px monospace';
  ctx.fillText('WAVE ' + (wave+1), W/2, 18);

  // Graze counter
  if (grazeCount > 0) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffee55';
    ctx.font = '11px monospace';
    ctx.fillText('かすり ' + grazeCount, W-8, 33);
  }

  // Death flash overlay
  if (deathFlash > 0) {
    ctx.fillStyle = `rgba(255,70,70,${(deathFlash/22)*0.45})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawWaveIntro() {
  const t    = waveIntroTimer;
  const D    = WAVE_INTRO_DUR;
  const word = WAVE_WORDS[Math.min(wave, WAVE_WORDS.length - 1)];

  // ── ダークオーバーレイ (フェードイン→維持→フェードアウト) ──
  const ovA = t > D-14 ? (D-t)/14 : t < 28 ? t/28 : 1;
  ctx.fillStyle = `rgba(2,0,8,${ovA * 0.94})`;
  ctx.fillRect(0, 0, W, H);

  // ── 衝撃フラッシュ (最初の14フレームだけ真っ赤) ──
  if (t > D - 14) {
    const fa = (t - (D-14)) / 14;
    ctx.fillStyle = `rgba(160,0,0,${fa * 0.82})`;
    ctx.fillRect(0, 0, W, H);
  }

  // ── テキストのアルファ ──
  const tA = t > D-8 ? 0 : t < 22 ? t/22 : 1;
  if (tA <= 0) return;

  // ── 文字サイズ (文字数に応じて調整) ──
  // 初期フォントサイズを文字数から算出し、実幅を測って収まるよう縮小
  let fs = word.length <= 1 ? 144 : word.length <= 2 ? 100 : word.length <= 4 ? 68 : word.length <= 10 ? 44 : 32;
  ctx.font = `bold ${fs}px serif`;
  const maxW = W - 32;
  while (fs > 14 && ctx.measureText(word).width > maxW) {
    fs -= 2;
    ctx.font = `bold ${fs}px serif`;
  }

  // ── スケール: 叩きつけるように大→等倍にパチンと収束 ──
  const sc = (t > D-18 ? 1 + ((t-(D-18))/10) * 1.3 : 1) * (1 + Math.sin(gf*0.09)*0.013);

  ctx.save();
  ctx.globalAlpha = tA;
  ctx.translate(W/2, H/2 - 10);
  ctx.scale(sc, sc);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${fs}px serif`;

  // 最外グロー
  ctx.shadowBlur = 90;
  ctx.shadowColor = '#ff0000';
  ctx.fillStyle = '#1a0000';
  ctx.fillText(word, 0, 0);

  // 中グロー
  ctx.shadowBlur = 45;
  ctx.shadowColor = '#ff2200';
  ctx.fillStyle = '#aa0000';
  ctx.fillText(word, 0, 0);

  // 本体の赤
  ctx.shadowBlur = 18;
  ctx.shadowColor = '#ff6644';
  ctx.fillStyle = '#ee2222';
  ctx.fillText(word, 0, 0);

  // 細い白ハイライト (上端がちょっと白く光る)
  ctx.globalAlpha = tA * 0.45;
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffcccc';
  ctx.fillText(word, 0, -fs*0.06);

  ctx.restore();

  // ── WAVE番号を小さく下に ──
  ctx.globalAlpha = tA * 0.55;
  ctx.fillStyle = '#662222';
  ctx.font = '13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('── WAVE ' + (wave + 1) + ' ──', W/2, H/2 + fs/2 + 30);
  ctx.globalAlpha = 1;
}

// ── ポーズ画面 ──────────────────────────────
function drawPause() {
  // 暗転オーバーレイ
  ctx.fillStyle = 'rgba(2,0,10,0.78)';
  ctx.fillRect(0, 0, W, H);

  // PAUSED 文字 (青白く明滅)
  const pulse = 0.6 + 0.4 * Math.sin(frame * 0.08);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowBlur = 30;
  ctx.shadowColor = '#3399ff';
  ctx.fillStyle = `rgba(180,220,255,${pulse})`;
  ctx.font = 'bold 52px serif';
  ctx.fillText('一時停止', W/2, H/2 - 24);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(150,190,235,0.85)';
  ctx.font = '15px monospace';
  ctx.fillText('PAUSED', W/2, H/2 + 18);

  // 再開ヒント
  ctx.fillStyle = 'rgba(120,160,210,0.75)';
  ctx.font = '12px monospace';
  const hint = (controlMode === 'gamepad') ? 'START で再開' : 'ESC で再開';
  ctx.fillText(hint, W/2, H/2 + 50);
  ctx.restore();
}

// ── 再開カウントダウン ──────────────────────
function drawCountdown() {
  // 薄暗いオーバーレイ (徐々に晴れる)
  const prog = pauseTimer / 180; // 1→0
  ctx.fillStyle = `rgba(2,0,10,${0.7 * prog})`;
  ctx.fillRect(0, 0, W, H);

  const n = Math.ceil(pauseTimer / 60); // 3,2,1
  const sub = (pauseTimer % 60) / 60;   // この数字内の進行 1→0
  // 各数字: 大きく出てスッと縮む
  const scl = 0.7 + sub * 1.1;
  const alpha = Math.min(1, sub * 2.2);

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.translate(W/2, H/2);
  ctx.scale(scl, scl);
  ctx.globalAlpha = alpha;
  ctx.shadowBlur = 40;
  ctx.shadowColor = '#ff3366';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 110px serif';
  ctx.fillText(n > 0 ? String(n) : '', 0, 0);
  ctx.restore();
}

  const sep = (y, col) => {
    ctx.fillStyle = col; ctx.fillRect(18, y, W-36, 1);
  };

  ctx.fillStyle = '#ffee44';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('─  HI - SCORE  ─', W/2, 182);

  const rankCol = ['#ffdd44', '#aaaacc', '#bb7733'];
  const rankLbl = ['1ST', '2ND', '3RD'];

  if (hiScores.length === 0) {
    ctx.fillStyle = '#3a2248';
    ctx.font = '12px monospace';
    ctx.fillText('─  NO  DATA  YET  ─', W/2, 218);
  } else {
    hiScores.slice(0, 3).forEach((s, i) => {
      const y = 200 + i * 26;
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = rankCol[i] || '#556677';

      ctx.fillStyle = '#445566';
      ctx.font = '11px monospace';
      ctx.fillText(`W${s.wave}  ${s.time}`, W - 24, y);
    });
  }

  sep(284, '#ff44aa');

  // ── コントロール選択カード ──
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#44ddff';
  ctx.font = 'bold 11px monospace';
  ctx.fillText('CONTROL  MODE', W/2, 294);

  CTRL_CARDS.forEach((card, i) => {
    const cx  = _CX0 + i * (_CW + _CGap);
    const sel = (i === menuSel);
    const avail = card.id !== 'gamepad' || gpConnected;

    // カード背景
    ctx.fillStyle = sel ? '#2a0840' : '#120420';
    ctx.beginPath();
    ctx.roundRect(cx, _CY1 + 4, _CW, _CY2 - _CY1 - 4, 6);
    ctx.fill();

    // カード枠
    ctx.strokeStyle = sel ? '#ff44aa' : (avail ? '#442255' : '#221133');
    ctx.lineWidth = sel ? 2 : 1;
    ctx.beginPath();
    ctx.roundRect(cx, _CY1 + 4, _CW, _CY2 - _CY1 - 4, 6);
    ctx.stroke();

    // 上部アクセント線 (選択時)
    if (sel) {
      ctx.fillStyle = '#ff44aa';
      ctx.fillRect(cx + 10, _CY1 + 4, _CW - 20, 2);
    }

    // アイコン
    ctx.globalAlpha = avail ? 1 : 0.35;
    ctx.font = '22px serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(card.icon, cx + _CW / 2, _CY1 + 30);

    // ラベル
    ctx.font = (sel ? 'bold ' : '') + '10px monospace';
    ctx.fillStyle = sel ? '#ff88cc' : (avail ? '#aa6688' : '#442233');
    ctx.fillText(card.label, cx + _CW / 2, _CY1 + 46);

    // 接続状態バッジ（ゲームパッドのみ）
    if (card.id === 'gamepad') {
      ctx.font = '9px monospace';
      ctx.fillStyle = gpConnected ? '#44ff88' : '#664455';
      ctx.fillText(gpConnected ? 'CONNECTED' : 'NO DEVICE', cx + _CW / 2, _CY1 + 58);
    }

    ctx.globalAlpha = 1;
  });

  // ヒントテキスト（選択中カードの操作説明）
  const selCard = CTRL_CARDS[menuSel];
  ctx.font = '10px monospace';
  ctx.fillStyle = '#557788';
  ctx.fillText(selCard.hint, W/2, _CY2 + 12);

  // ナビヒント
  ctx.font = '10px monospace';
  ctx.fillStyle = '#332244';
  ctx.fillText('◀ ▶ で切替', W/2, _CY2 + 25);

  ctx.restore();

  sep(390, '#ff44aa');

  // ── PRESS ANY KEY (点滅) ──
  if (Math.floor(frame / 22) % 2 === 0) {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 17px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PRESS  ANY  KEY', W/2, 412);
  }
  ctx.fillStyle = '#332244';
  ctx.font = '11px monospace';
  ctx.fillText('タップ / クリック でもOK', W/2, 430);

  // ── 下部デコレーション ──
  ctx.fillStyle = '#ff44aa';
  ctx.font = '10px monospace';
  ctx.fillText('★  ───────────────────  ★', W/2, H - 28);
  ctx.fillStyle = '#1e0c28';
  ctx.font = '10px monospace';
  ctx.fillText('© 2026  BULLET HELL PRACTICE  1 CREDIT', W/2, H - 12);
}

function drawGameOver() {
  drawBg();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ff4466';
  ctx.font = 'bold 34px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W/2, H/2 - 100);

  const rows = [
    ['生存時間', fmtTime(survivedF)],
    ['スコア',   score.toLocaleString()],
    ['かすり',   grazeCount + ' 回'],
    ['WAVE',     String(wave + 1)],
  ];
  ctx.font = '15px monospace';
  rows.forEach(([k, v], i) => {
    ctx.textAlign = 'left';  ctx.fillStyle = '#776688'; ctx.fillText(k, W/2 - 80, H/2 - 35 + i*34);
    ctx.textAlign = 'right'; ctx.fillStyle = '#ffffff'; ctx.fillText(v, W/2 + 80, H/2 - 35 + i*34);
  });

  const pulse = 0.6 + 0.4 * Math.sin(frame * 0.07);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#ffee55';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('タップ / クリック / キーでリトライ', W/2, H/2 + 145);
  ctx.globalAlpha = 1;
}

// ══════════════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════════════
function updateMenuGamepad() {
  const gp = (navigator.getGamepads?.() || [])[0];
  if (!gp) return;
  const btnA = gp.buttons[0]?.pressed;
  const axL  = gp.axes[0] < -0.5;
  const axR  = gp.axes[0] >  0.5;
  if (axL && !_gpPrevL) menuSel = (menuSel + 2) % 3;
  if (axR && !_gpPrevR) menuSel = (menuSel + 1) % 3;
  if (btnA && !_gpPrevA) onAction();
  _gpPrevA = btnA; _gpPrevL = axL; _gpPrevR = axR;
}

function pollGamepadPause() {
  const gp = (navigator.getGamepads?.() || [])[0];
  if (!gp) { _gpPrevStart = false; return; }
  const start = gp.buttons[9]?.pressed; // Start / Options ボタン
  if (start && !_gpPrevStart && (gs === 'play' || gs === 'pause')) togglePause();
  _gpPrevStart = start;
}

function loop() {
  frame++;
  if (gs === 'menu') updateMenuGamepad();
  else pollGamepadPause();
  update();

  if (gs === 'menu') {
    drawMenu();
  } else if (gs === 'gameover') {
    drawGameOver();
  } else {
    drawBg();
    drawBoss();
    drawBullets();
    drawPlayer();
    drawHUD();
    if (waveIntroTimer > 0) drawWaveIntro();
    if (gs === 'pause')     drawPause();
    if (gs === 'countdown') drawCountdown();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
